name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md', '**.txt']
  pull_request:
    paths-ignore: ['docs/**', '**.md', '**.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: テスト（Core自己テスト）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-dotnet@v4 # TODO: SHA固定
        with:
          dotnet-version: '8.0.x'
      - name: 自己テスト実行（Core・暗号）と試験データ出力
        run: >
          dotnet run --project src/BatonE2E.Tests -c Release --
          --ini "$PWD/src/BatonE2E/Lang/ja.ini" --emit-vectors "$RUNNER_TEMP/vectors.json"
      - name: 暗号の相互運用テスト（C#で暗号化 → Node.js WebCryptoで復号）
        run: node src/BatonE2E.Tests/interop/verify.mjs "$RUNNER_TEMP/vectors.json"
      - name: 失敗時の説明
        if: failure()
        run: echo "::error::テストが失敗。『自己テスト』の段で落ちたならログの『NG』行がCore/暗号の不具合。『相互運用テスト』の段で落ちたなら、C#とブラウザ(WebCrypto)で鍵導出・nonce・AADのどれかが食い違っている。"

  integration:
    name: 結合テスト（実アプリ＋ffmpeg/curl/生ソケット＋Chromium）
    needs: test
    runs-on: ubuntu-latest
    env:
      SRC_PORT: '18000'
      VIEW_PORT: '18080'
      SRC_PASS: 'src-test-pass'
      VIEW_PASS: 'view-test-pass'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-dotnet@v4 # TODO: SHA固定
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4 # TODO: SHA固定
        with:
          node-version: '22'
      - name: ffmpeg準備
        run: |
          which ffmpeg curl || (sudo apt-get update && sudo apt-get install -y ffmpeg curl)
          ffmpeg -version | head -1
      - name: アプリをビルド
        run: dotnet build src/BatonE2E/BatonE2E.csproj -c Release -o "$RUNNER_TEMP/app" -p:BuildNumber=${{ github.run_number }}
      - name: 試験用MP3を作成（再生6秒・byte一致比較用にXing/ID3なし）
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=6" -ar 44100 -ac 2 -b:a 96k \
            -write_xing 0 -id3v2_version 0 -f mp3 "$RUNNER_TEMP/work/test.mp3"
          ls -l "$RUNNER_TEMP/work/test.mp3"
      - name: アプリ起動
        run: |
          nohup dotnet "$RUNNER_TEMP/app/BatonE2E.dll" --source-port $SRC_PORT --view-port $VIEW_PORT \
            --source-password "$SRC_PASS" --password "$VIEW_PASS" --title "テスト配信" \
            --cert-dir "$RUNNER_TEMP/work/cert" > "$RUNNER_TEMP/work/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs "http://127.0.0.1:$VIEW_PORT/" >/dev/null && exit 0; sleep 0.5; done
          echo "::error::アプリが起動しない"; cat "$RUNNER_TEMP/work/app.log"; exit 1
      - name: 'シナリオ（送信→受信→復号→元MP3とバイト一致）'
        env:
          WORK: ${{ runner.temp }}/work
          CERT_DIR: ${{ runner.temp }}/work/cert
        run: |
          export TEST_MP3="$WORK/test.mp3"
          S=src/BatonE2E.Tests/integration/scenario.sh
          fail=0
          for n in curl-put curl-chunked ffmpeg-icecast raw-source10 raw-ice4 raw-ice3 tls12; do
            echo "::group::$n"; bash $S $n || fail=1; echo "::endgroup::"
            sleep 1
          done
          exit $fail
      - name: Chromiumで実再生
        run: |
          cd "$RUNNER_TEMP/work" && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          ffmpeg -loglevel error -re -stream_loop -1 -f lavfi -i "sine=frequency=440" -t 120 -ar 44100 -ac 2 -b:a 96k \
            -f mp3 -content_type audio/mpeg "icecast://source:$SRC_PASS@127.0.0.1:$SRC_PORT/stream" &
          fpid=$!; sleep 2
          cp "$GITHUB_WORKSPACE/src/BatonE2E.Tests/integration/browser.mjs" .
          node browser.mjs \
            "http://127.0.0.1:$VIEW_PORT/" "$VIEW_PASS" "テスト配信"; rc=$?
          kill $fpid 2>/dev/null || true; exit $rc
      - name: アプリのログ表示
        if: always()
        run: cat "$RUNNER_TEMP/work/app.log" || true
      - name: 失敗時の説明
        if: failure()
        run: echo "::error::結合テスト失敗。どのシナリオ名で落ちたか（curl-put/curl-chunked/ffmpeg-icecast/raw-*/tls12/Chromium）とアプリのログを確認。シナリオ名ごとに送信形式が異なる。"

  build:
    name: ビルド（Windows exe）
    needs: [test, integration]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write   # 古い成果物の削除に必要
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-dotnet@v4 # TODO: SHA固定
        with:
          dotnet-version: '8.0.x'
      - name: 発行（単体exe）
        shell: bash
        run: |
          dotnet publish src/BatonE2E/BatonE2E.csproj -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:BuildNumber=${{ github.run_number }} -o out/BatonE2E
          cp LICENSE out/BatonE2E/LICENSE.txt
          ls -la out/BatonE2E out/BatonE2E/Lang
      - name: 成果物の登録（フォルダのまま渡し、ZIPの二重化を避ける）
        uses: actions/upload-artifact@v4 # TODO: SHA固定
        with:
          name: BatonE2E-build${{ github.run_number }}
          path: out/BatonE2E/
          if-no-files-found: error
      - name: 古い成果物の削除（直近2件を残す）
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name|startswith("BatonE2E-build")) | [.created_at,.id] | @tsv' \
            | sort -r | tail -n +3 | cut -f2 \
            | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true; done

  release:
    name: Releases公開（タグのみ）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4 # TODO: SHA固定
        with:
          name: BatonE2E-build${{ github.run_number }}
          path: BatonE2E
      - name: ZIP作成と公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r BatonE2E-${{ github.ref_name }}.zip BatonE2E
          gh release create "${{ github.ref_name }}" BatonE2E-${{ github.ref_name }}.zip \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes

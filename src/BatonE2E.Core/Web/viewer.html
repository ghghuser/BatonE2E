<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#fff;--fg:#1b1b1b;--sub:#666;--card:#f3f4f6;--line:#d0d4da;--acc:#2563eb;--ok:#15803d;--warn:#a16207;--err:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--fg:#e8e8e8;--sub:#9aa0a6;--card:#1d2127;--line:#343a42;--acc:#60a5fa;--ok:#4ade80;--warn:#facc15;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif}
main{max-width:30rem;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:1.25rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:1rem;margin-bottom:1rem}
label{display:block;font-size:.9rem;color:var(--sub);margin-bottom:.25rem}
input[type=password],input[type=text]{width:100%;padding:.7rem;font-size:1rem;border:1px solid var(--line);border-radius:.4rem;background:var(--bg);color:var(--fg)}
button{margin-top:.75rem;width:100%;padding:.75rem;font-size:1rem;border:0;border-radius:.4rem;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#status{color:var(--sub)} #status.ok{color:var(--ok)} #status.warn{color:var(--warn)}
#err{color:var(--err);font-weight:600;min-height:1.5rem}
#title{font-weight:600;word-break:break-all}
audio{width:100%;margin-top:.5rem}
small{color:var(--sub)}
</style>
</head>
<body>
<!-- ▼ ここから </main> までは、見た目（HTML/CSS）を自由に編集できます。id="..." の付いた要素は、下のスクリプトが使うので消さないでください。 -->
<main>
<h1 id="h1">{{TITLE}}</h1>
<div class="card">
  <label for="pw" id="lblPw">パスワード</label>
  <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="go">再生</button>
  <button id="stopBtn" hidden>停止</button>
</div>
<div class="card">
  <div id="status">待機中</div>
  <div id="title"></div>
  <div id="err" role="alert"></div>
  <button id="retry" hidden>再接続</button>
  <audio id="a" controls></audio>
</div>
<small id="note">音声は端末内で復号されます（AES-256-GCM）。</small>
</main>
<!-- ▲ 編集できるのはここまで。下の <script> は変更しないでください（変更すると、セキュリティ設定(CSP)によりブラウザが実行を拒否し、再生できなくなります。<script>を足しても実行されません）。 -->
<script>
"use strict";
// 表示文言（この<script>は変更しないこと。CSPにより標準のスクリプトだけが実行される）
const T={wait:"待機中",connecting:"接続中…",deriving:"鍵を生成中…",playing:"受信・再生中",nosrc:"配信の開始を待っています…",
 badpw:"パスワードが違います",tamper:"データの改ざんまたは破損を検出したため停止しました。再接続してください。",
 seq:"受信の順序が崩れたため停止しました。再接続してください。",nocrypto:"暗号機能が使えません。https（または localhost）で開いてください。",
 nomse:"このブラウザは非対応です（MediaSource未対応）。PCのChrome・Edge・Firefox、またはAndroidのChromeを使用してください。",
 unsup:"この形式は再生できません。配信側でtranscodeを有効にしてください。",full:"視聴者数の上限に達しています。",
 stoppedMsg:"停止しました",lost:"切断されました。再接続します…",hdr:"配信側の暗号設定に対応していません。",chg:"形式が変更されました。再接続してください。"};
const $=id=>document.getElementById(id);
const MSE=window.ManagedMediaSource||window.MediaSource;
const enc=new TextEncoder(),dec=new TextDecoder(),PFX=enc.encode("E2ERv1");
const IT_MIN=100000,IT_MAX=10000000;
let pw="",ws=null,key=null,keyId="",sid=null,expect=null,ms=null,sb=null,msReady=null,mime="",
    queue=[],needSync=true,stopped=true,chain=Promise.resolve(),retryMs=2000,retryTimer=0,gotConfirm=false,autoPlayed=false;
class Fatal extends Error{constructor(m,retry){super(m);this.retry=!!retry;}}
function setStatus(t,c){const s=$("status");s.textContent=t;s.className=c||"";}
function setErr(t){$("err").textContent=t||"";}
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}

async function deriveKey(h){
  const id=h.salt+"|"+h.iter+"|"+pw;
  if(key&&keyId===id)return;
  const km=await crypto.subtle.importKey("raw",enc.encode(pw.normalize("NFC")),"PBKDF2",false,["deriveKey"]);
  key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(h.salt),iterations:h.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  keyId=id;
}
async function open(buf){
  const u=new Uint8Array(buf);
  if(u.length<8+1+16)throw new Fatal(T.tamper);
  const seq=u.subarray(0,8),iv=new Uint8Array(12),aad=new Uint8Array(PFX.length+4+8);
  iv.set(sid,0);iv.set(seq,4);aad.set(PFX,0);aad.set(sid,PFX.length);aad.set(seq,PFX.length+4);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv,additionalData:aad,tagLength:128},key,u.subarray(8));
  return{seq:Number(new DataView(buf).getBigUint64(0)),data:new Uint8Array(pt)};
}

function mseSetup(){
  if(ms)return;
  ms=new MSE();
  const a=$("a");a.disableRemotePlayback=true;a.src=URL.createObjectURL(ms);
  msReady=new Promise(r=>ms.addEventListener("sourceopen",r,{once:true}));
  a.play().catch(()=>{});
}
async function setMime(m){
  if(!MSE.isTypeSupported(m))throw new Fatal(T.unsup);
  await msReady;
  if(!sb){sb=ms.addSourceBuffer(m);sb.mode="sequence";sb.addEventListener("updateend",pump);
    sb.addEventListener("error",()=>fail(new Fatal(T.unsup)));}
  else if(m!==mime){
    if(typeof sb.changeType!=="function")throw new Fatal(T.chg,true);
    queue.length=0;needSync=true;sb.changeType(m);
  }
  mime=m;
}
function syncAt(u){ // 最初のフレーム同期位置（MP3: 0xFFEx / AAC(ADTS): 0xFFFx）
  const mask=/mpeg|mp3/.test(mime)?0xE0:/aac/.test(mime)?0xF0:0;
  if(!mask)return 0;
  for(let i=0;i+1<u.length;i++)if(u[i]===0xFF&&(u[i+1]&mask)===mask)return i;
  return -1;
}
function feed(u){
  if(needSync){const i=syncAt(u);if(i<0)return;u=u.subarray(i);needSync=false;}
  queue.push(u);pump();
}
function pump(){
  if(!sb||sb.updating||ms.readyState!=="open")return;
  const a=$("a");
  try{
    if(sb.buffered.length){ // 古いバッファの削除と、遅延が溜まった場合の追従
      const s=sb.buffered.start(0),e=sb.buffered.end(sb.buffered.length-1);
      if(a.currentTime-s>30){sb.remove(s,a.currentTime-15);return;}
      if(e-a.currentTime>20)a.currentTime=e-2;
    }
    if(!queue.length)return;
    sb.appendBuffer(queue.shift());
    if(a.paused&&!autoPlayed){autoPlayed=true;a.play().catch(()=>{});}
  }catch(e){
    if(e.name==="QuotaExceededError"&&sb.buffered.length){sb.remove(sb.buffered.start(0),Math.max(sb.buffered.start(0),a.currentTime-5));}
    else fail(new Fatal(T.unsup));
  }
}

async function onMsg(d){
  if(stopped)return;
  if(typeof d==="string"){
    let h;try{h=JSON.parse(d);}catch{throw new Fatal(T.hdr);}
    if(h.v!==1||h.kdf!=="PBKDF2-SHA256"||!Number.isInteger(h.iter)||h.iter<IT_MIN||h.iter>IT_MAX)throw new Fatal(T.hdr);
    sid=b64(h.sid);if(sid.length!==4||b64(h.salt).length<16)throw new Fatal(T.hdr);
    setStatus(T.deriving);await deriveKey(h);
    await setMime(h.mime||"audio/mpeg");
    expect=null;gotConfirm=false;needSync=true;queue.length=0;
    return;
  }
  if(!gotConfirm){
    let r;try{r=await open(d);}catch{throw new Fatal(T.badpw);}
    if(r.seq!==0||r.data[0]!==0||dec.decode(r.data.subarray(1))!=="E2ERADIO1")throw new Fatal(T.badpw);
    gotConfirm=true;retryMs=2000;setStatus(T.nosrc,"ok");return;
  }
  let r;try{r=await open(d);}catch{throw new Fatal(T.tamper,true);}
  if(r.seq<1||(expect!==null&&r.seq!==expect))throw new Fatal(T.seq,true);
  expect=r.seq+1;
  const t=r.data[0],p=r.data.subarray(1);
  if(t===1){feed(p);setStatus(T.playing,"ok");}
  else if(t===2){try{$("title").textContent=JSON.parse(dec.decode(p)).title||"";}catch{}}
  else if(t===3){await setMime(dec.decode(p));}
  else throw new Fatal(T.tamper,true);
}
function resetMedia(){ // 再生側を作り直す（停止後に再生すると常に最新から始まる）
  const a=$("a");try{a.pause();}catch{}
  a.removeAttribute("src");a.load();
  ms=null;sb=null;msReady=null;mime="";queue.length=0;needSync=true;autoPlayed=false;
}
function stopPlay(){
  stopped=true;clearTimeout(retryTimer);
  if(ws){ws.onclose=null;try{ws.close();}catch{}ws=null;}
  resetMedia();setErr("");$("title").textContent="";setStatus(T.stoppedMsg);
  $("retry").hidden=true;$("stopBtn").hidden=true;$("go").disabled=false;
}
function fail(e){
  if(stopped)return;
  stopped=true;if(ws){ws.onclose=null;try{ws.close();}catch{}ws=null;}
  clearTimeout(retryTimer);
  setErr(e.message);setStatus("","");$("stopBtn").hidden=true;
  $("retry").hidden = !e.retry;$("go").disabled=false;
}
function connect(){
  clearTimeout(retryTimer);setErr("");setStatus(T.connecting);
  const u=(location.protocol==="https:"?"wss://":"ws://")+location.host+(location.pathname.endsWith("/")?location.pathname:location.pathname+"/")+"ws";
  ws=new WebSocket(u);ws.binaryType="arraybuffer";
  ws.onmessage=ev=>{chain=chain.then(()=>onMsg(ev.data)).catch(fail);};
  ws.onclose=()=>{if(stopped)return;
    chain=chain.then(()=>{if(stopped)return;
      if(!gotConfirm&&!sid){fail(new Fatal(T.full,true));return;}
      setStatus(T.lost,"warn");retryTimer=setTimeout(connect,retryMs);retryMs=Math.min(retryMs*2,30000);});};
}
function start(){
  if(!window.crypto||!crypto.subtle){setErr(T.nocrypto);return;}
  if(!MSE){setErr(T.nomse);return;}
  pw=$("pw").value;if(!pw)return;
  mseSetup();   // 再生の許可を得るため、クリック操作の中でMediaSourceを用意
  $("go").disabled=true;$("stopBtn").hidden=false;$("retry").hidden=true;stopped=false;retryMs=2000;
  key=null;keyId="";gotConfirm=false;chain=Promise.resolve();
  connect();
}
$("go").onclick=start;
$("stopBtn").onclick=stopPlay;
$("retry").onclick=()=>{$("retry").hidden=true;stopped=false;chain=Promise.resolve();gotConfirm=false;connect();};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")start();});
setStatus(T.wait);
</script>
</body>
</html>

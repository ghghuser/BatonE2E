gui.tip.mirrorno=A number (1-99) for when you run several mirrors of the same original. It is appended to the viewer page path (_mirror-N) and to the title ((mirror N)) so mirrors can be told apart.
gui.set.mirrorpath=Viewer page (automatic)
gui.tip.mirrorpath=The mirror's viewer page path and title cannot be chosen; they are derived from the upstream URL and the mirror number.
- Path: the original path followed by "_mirror-N". This avoids mixing it up with the original URL and makes the original URL harder to guess.
- Title: the original viewer page's title followed by "(mirror N)" (the title from the "Relay" tab if it cannot be fetched).

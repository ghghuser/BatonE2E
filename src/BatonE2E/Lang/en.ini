; ---- Mirror (settings and screens) ----
gui.set.mode=Mode
gui.mode.relay=Normal (receive from streaming software)
gui.mode.mirror=Mirror (receive from another BatonE2E)
gui.tip.mode=Normal: receives from streaming software such as oddcast and relays it (uses the "Relay" tab settings).
Mirror: receives the stream, still encrypted, from another BatonE2E (its viewer page) and relays it. Use it to spread viewers out or to make a backup viewing URL.
- A mirror has no password and cannot decrypt the audio. Viewers enter the same password as for the original.
- The viewer page is served by this mirror, but its path (original path + _mirror-N) and title (original title + (mirror N)) are fixed automatically, and only the standard viewer page is served (viewer.html / viewer.css overrides are ignored).
- This prevents mix-ups and configuration mistakes; it cannot stop an administrator of the mirror PC who deliberately modifies the program (if the viewer page is altered, the typed password can be stolen). Run a mirror only on a PC you control.
- In mirror mode the streaming-software settings (source port, passwords, TLS, mount, viewer page path and title) are unused (grayed out on the "Relay" tab).
gui.set.upstream=Upstream URL
gui.tip.upstream=Paste the viewer page URL of the original BatonE2E (e.g. https://xxxx.ts.net/live-abc ).\n- The mirror connects to it as an ordinary viewer. It is subject to the original's access control (deny rules, connection limits) and counts as one viewer there.\n- If the original stops, the mirror keeps reconnecting automatically (interval up to 60 s). If the original restarts as a new stream, the mirror's viewers reconnect automatically.\n- http / ws also work. The audio stays encrypted, but others on the same network can see that a stream exists.\n- If the streaming software changes format (e.g. mp3) mid-stream, viewers who connect to the mirror afterwards may be unable to play (restart the original stream).
gui.err.upstream=The mirror's upstream URL is invalid (give the viewer page URL: https://..., http://..., wss://... or ws://...)
gui.err.upstreamself=The upstream URL points at this app's own viewer page

gui.tip.language=The display language. "Follow the system" uses Japanese when the OS display language is Japanese, and English otherwise.
Changes apply after saving and restarting.
gui.tip.srcbind=127.0.0.1 (localhost) = only an encoder on this PC can connect (normal). Change it only to let another PC connect (0.0.0.0 = all addresses). If changed, TLS cannot be "Off" and the source password needs {0}+ characters.
gui.tip.srcport=The port your encoder (oddcast etc.) connects to. Use a different number from the viewer port.
gui.tip.viewport=The port viewers' browsers (or the tunnel) connect to.
gui.tip.viewpath=Example: /live-abc . "/" = root. Letters, digits and - _ . ~ / only. Any other path returns 404.
gui.tip.mount=Use the same value as the encoder's mount point. A mismatch only logs a warning and is still accepted. Unrelated to the viewer URL.
gui.tip.title=Heading and tab name of the viewer page. The app name is not shown.
gui.tip.maxviewers=Maximum simultaneous viewers (1-1000).
gui.tip.srcpass=The password to set in your encoder. Leave empty to generate a new one at every start.
gui.tip.viewpass=The passphrase viewers type in the browser. Non-ASCII (e.g. Japanese) is allowed. Shorter than {0} characters cannot be saved, shorter than {1} gives a warning. Leave empty to generate a new one at every start.
gui.tip.tls=Auto-detect accepts plain and TLS. "Off" sends the source password unencrypted (low risk on the same PC).
gui.tip.anyuser=A fallback for encoders without a user name field. The password is always checked.
gui.tip.connlimit=Maximum simultaneous connections from the same client (IP). 0 = unlimited. Behind a tunnel, enable "Use tunnel client IP" to identify the real client.
gui.tip.rate=If a client makes the given number of requests within the given seconds, it is refused for the given seconds (current connections are dropped too). Set any of them to 0 to disable.
gui.tip.proxy=Tunnels such as Tailscale Funnel or ngrok all appear to come from this PC. When on, the real client is taken from X-Forwarded-For (rightmost value), only for connections from this PC. When off, IP, rate and connection limits treat all viewers as one person.
gui.tip.deny=One rule per line.\nip:203.0.113.5\nip:10.0.0.0/8\nua:regex (User-Agent)\nhost:regex (Host header)\nCase-insensitive. Lookahead/backreferences are not supported. Lines starting with # are comments. Example: ua:curl|python-requests
gui.tip.logfile=Appends to BatonE2E.log next to the exe.
gui.tip.template=Exports viewer.html and viewer.css into the "viewer" folder next to the exe (existing files are never overwritten).\n- viewer.css: the safe way to change only the look (injected into the standard page).\n- viewer.html: replaces the whole standard page including JavaScript. Keep the element ids (pw, go, stopBtn, a, status, title, err, retry) and {{TITLE}}.\nChanges apply from the next page load (no restart).

gui.tip.language=言語の変更は、保存して再起動すると反映されます。
gui.tip.srcbind=127.0.0.1（localhost）＝このPC内のoddcastだけが接続できます（通常はこのまま）。別のPCから接続させたい場合のみ変更します（0.0.0.0＝全アドレス）。変更する場合はTLSを「なし」にできず、sourceパスワードは{0}文字以上が必要です。
gui.tip.srcport=oddcastなど配信ソフトが接続するポート。視聴ポートとは別の番号にします。
gui.tip.viewport=視聴者のブラウザ（またはトンネル）が接続するポート。
gui.tip.viewpath=例: /live-abc 。「/」なら直下。英数字と - _ . ~ / のみ使えます。設定したパス以外は404になります。
gui.tip.mount=配信ソフト側の「マウントポイント」と同じ値にします。違っていても警告をログに出すだけで受け付けます。視聴URLとは無関係です。
gui.tip.title=視聴ページの見出し・タブ名。アプリ名は表示されません。
gui.tip.maxviewers=同時に視聴できる人数の上限（1〜1000）。
gui.tip.srcpass=配信ソフトに設定するパスワード。空欄にすると中継の開始ごとに自動生成します。
gui.tip.viewpass=視聴者がブラウザで入力するパスフレーズ。日本語も使えます。{0}文字未満は保存できず、{1}文字未満は警告します。空欄にすると中継の開始ごとに自動生成します。
gui.tip.tls=自動判定＝平文もTLSも受け付けます。「なし」にすると、sourceのパスワードが暗号化されずに流れます（同じPC内なら実害は小さい）。
gui.tip.anyuser=oddcastなどにユーザー名の入力欄がない場合の逃げ道。パスワードは必ず検査します。
gui.tip.connlimit=同じ接続元（IP）からの同時接続数の上限。0＝無制限。トンネル経由のときは「トンネル経由のIPを使う」で本当の接続元を判定します。
gui.tip.rate=指定秒数の間に指定回数以上アクセスしたら、指定秒数のあいだ拒否します（接続中の視聴者も切断）。どれかを0にすると連打制限なし。
gui.tip.proxy=Tailscale FunnelやngrokなどのトンネルはすべてこのPCから来るように見えます。オンにすると X-Forwarded-For（最も右の値）で本当の接続元を判定します。このPC内からの接続でのみ有効です。オフだと、IP制限・連打制限・接続数制限がすべての視聴者を同一人物として扱います。
gui.tip.deny=1行に1つ。\nip:203.0.113.5\nip:10.0.0.0/8\nua:正規表現（UserAgent）\nhost:正規表現（Hostヘッダー）\n大文字小文字は区別しません。先読み・後方参照は使えません。#で始まる行は注釈。例: ua:curl|python-requests
gui.tip.logfile=exeの横の BatonE2E.log に追記します。
gui.tip.template=exeの横の viewer フォルダに viewer.html と viewer.css を出力します（既存のファイルは上書きしません）。\n・viewer.css: 見た目だけを変える安全な方法（標準ページに差し込まれます）。\n・viewer.html: 置くと標準ページ全体（JavaScript含む）が置き換わります。要素のid（pw, go, stopBtn, a, status, title, err, retry）と {{TITLE}} は残してください。\n保存すると次のページ読み込みから反映されます（再起動不要）。
gui.err.range={0}は{1}〜{2}の整数で入力してください。
gui.err.denyrule=拒否リスト {0}

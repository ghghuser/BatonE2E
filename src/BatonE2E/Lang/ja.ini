gui.tip.profile=設定一式に名前をつけて保存し、あとで呼び出す機能です。\n・この名前で保存: 現在の入力欄の内容を保存します（下の「保存」とは別で、config.json は変わりません）。\n・読込: 入力欄へ反映します。下の「保存」で確定するまで有効になりません（言語・ログのファイル出力・トレイ格納は切り替わりません）。\n・パスワードを入力している場合は、プロファイルのファイル（profilesフォルダ）にも平文で保存されます（config.jsonと同じ扱い）。
